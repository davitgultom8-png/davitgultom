<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Of Love ❤️</title>
  
  <!-- Logo Love Merah pada Tab Browser (Favicon) -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2107/2107845.png" type="image/png">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #ffb6c1, #ff69b4, #ffc0cb);
      background-attachment: fixed;
      background-size: cover;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Background Anime Overlay */
    .bg-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url("images/anime-love-bg.jpg") no-repeat center center;
      background-size: cover;
      opacity: 0.3;
      z-index: -1;
    }

    h1, h2 {
      text-shadow: 2px 2px 8px rgba(199, 21, 133, 0.7);
    }

    .gallery {
      position: relative;
      width: 100%;
      height: 70vh;
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img {
      position: absolute;
      max-width: 85%;
      max-height: 450px;
      border: 8px solid #fff;
      border-radius: 20px;
      opacity: 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      object-fit: cover;
      transition: transform 0.5s;
    }

    /* Animasi Muncul Bergantian */
    @keyframes showHide {
      0% { opacity: 0; transform: scale(0.8) rotate(-2deg); }
      10% { opacity: 1; transform: scale(1) rotate(0deg); }
      90% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.1) rotate(2deg); }
    }

    .animate-photo {
      animation: showHide 8s infinite;
    }

    /* Pesan Teks */
    #pesan-akhir {
      opacity: 0;
      margin-top: 20px;
      font-size: 1.5rem;
      padding: 0 20px;
    }

    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.5);
      padding: 10px 15px;
      border-radius: 30px;
      font-size: 14px;
      color: #c71585;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <h1 id="title">💖 Selamat wisuda sayang 💖</h1>

  <div class="gallery" id="photo-container">
    <!-- Foto akan dimuat otomatis oleh JavaScript agar lebih rapi -->
  </div>

  <h2 id="pesan-akhir">💖 Jangan berhenti mencintaiku dan jangan berubah sampai kapanpun 💖</h2>

  <audio id="mySong" loop>
    <source src="musik/musik/TitiDj-JanganBerhentiMencintaiku.mp3" type="audio/mpeg">
  </audio>

  <div class="music-control" onclick="playMusic()">🎵 Klik untuk Musik</div>

  <script>
    const totalPhotos = 17;
    const container = document.getElementById('photo-container');

    // Generate elemen foto secara otomatis
    for (let i = 1; i <= totalPhotos; i++) {
      const img = document.createElement('img');
      img.src = `images/foto${i}.jpeg`;
      img.alt = `Memori ${i}`;
      // Delay antar foto 8 detik
      img.style.animation = `showHide 8s forwards`;
      img.style.animationDelay = `${(i - 1) * 8}s`;
      container.appendChild(img);
    }

    // Munculkan pesan akhir setelah semua foto selesai
    setTimeout(() => {
      document.getElementById('pesan-akhir').style.opacity = '1';
      document.getElementById('pesan-akhir').style.transition = 'opacity 2s';
    }, totalPhotos * 8000);

    function playMusic() {
      var audio = document.getElementById('mySong');
      audio.play();
      document.querySelector('.music-control').innerHTML = "🎵 Musik Aktif";
    }

    // Klik di mana saja untuk putar musik (antisipasi kebijakan browser)
    document.body.addEventListener('click', function() {
      playMusic();
    }, { once: true });

    // Opsional: Tutup otomatis (Hati-hati: beberapa browser memblokir window.close jika tidak dibuka via JS)
    setTimeout(function() {
      console.log("Selesai");
    }, (totalPhotos * 8 + 10) * 1000); 
  </script>
</body>
</html>
